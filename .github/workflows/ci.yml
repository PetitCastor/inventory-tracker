name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Use pull_request_target only for the metadata-only cleanup job below. It does
  # not check out or run pull-request code and needs write access to delete refs.
  pull_request_target:
    branches: [main]
    types: [closed]

# Least privilege by default. Only the publish job needs to write, and it asks for
# that itself — a workflow-level write would hand the same token to the build job,
# which runs on every pull request.
permissions:
  contents: read

jobs:
  delete-merged-branch:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Delete merged branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const ref = `heads/${branch}`;

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
              });
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch ${branch} is already deleted.`);
                return;
              }
              throw error;
            }

            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
            });

  build:
    # WinExe / net10.0-windows (UseWindowsForms) only builds on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore InventoryTracker.slnx

      - name: Build
        run: dotnet build InventoryTracker.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test InventoryTracker.slnx --configuration Release --no-build

  # Publishes the self-contained single-file exe and cuts a GitHub Release for it.
  # Only on a merge landing in main — never for a PR, which just gets the checks above.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview

      # The version comes from the VERSION file. A PR can bump it by hand for a
      # deliberate minor/major release; github.run_number was previously used instead,
      # but it counts pull-request runs too, so released versions skipped numbers and
      # would collide if the workflow were ever renamed.
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # Every merge to main ships a release, whether or not the PR bumped VERSION.
      # main requires PRs and has enforce_admins on (no direct pushes, even from this
      # job's own token), so there is nowhere to commit an auto-bump back to — instead
      # this compares VERSION against the latest actual release and, if VERSION is not
      # already ahead of it (i.e. the PR didn't bump it), patch-bumps past that release
      # for this run only. A PR that did bump VERSION past the latest release is used
      # as committed.
      - name: Determine release version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          committed="${{ steps.version.outputs.version }}"
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || echo v0.0.0)"
          latest="${latest#v}"

          num() { IFS='.' read -r a b c <<< "$1"; echo $(( a * 1000000 + b * 1000 + c )); }

          if [ "$(num "$committed")" -gt "$(num "$latest")" ]; then
            version="$committed"
          else
            IFS='.' read -r major minor patch <<< "$latest"
            version="$major.$minor.$((patch + 1))"
            echo "VERSION ($committed) is not ahead of the latest release (v$latest); releasing v$version instead."
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Same script developers run locally, so the two cannot drift. The version stamped
      # into the exe is whatever Determine release version settled on, which may be ahead
      # of the VERSION file committed in the repo — see that step's comment.
      - name: Publish
        shell: pwsh
        run: ./publish.ps1 -Version '${{ steps.release.outputs.version }}'

      # Pinned to a commit rather than the mutable v2 tag: this step runs with a
      # write-capable token.
      #
      # The asset keeps the unversioned name on purpose. The auto-updater swaps the new
      # build in at the running exe's own path, so a versioned file name would be frozen
      # at whatever release was first downloaded and misreport every later one. A fixed
      # name also keeps releases/latest/download/InventoryTracker.exe a stable link. The
      # version lives in the tag, the release title and the exe's assembly version.
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: v${{ steps.release.outputs.version }}
          files: dist/InventoryTracker.exe
