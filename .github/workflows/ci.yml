name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The publish job creates a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    # WinExe / net10.0-windows (UseWindowsForms) only builds on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore src/InventoryTracker.csproj

      - name: Build
        run: dotnet build src/InventoryTracker.csproj --configuration Release --no-restore

  # Publishes the self-contained single-file exe and cuts a GitHub Release for it.
  # Only on a merge landing in main — never for a PR, which just gets the build check above.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview

      # 0.1 is the starting line the project was published at; the run number gives every
      # merge to main its own increasing patch version without needing to commit a bump
      # back into the protected branch.
      - name: Compute version
        id: version
        shell: bash
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/InventoryTracker.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained:true `
            --output dist `
            --nologo `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:GenerateDocumentationFile=false `
            -p:SatelliteResourceLanguages=en `
            -p:Version=${{ steps.version.outputs.version }}

          Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Extension -ne '.exe' } | Remove-Item -Force

          Rename-Item -LiteralPath 'dist\InventoryTracker.exe' `
            -NewName "InventoryTracker-v${{ steps.version.outputs.version }}.exe"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: dist/InventoryTracker-v${{ steps.version.outputs.version }}.exe
